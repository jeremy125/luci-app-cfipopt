name: "Build and Release ipk"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ipk
        run: python3 build_ipk.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "luci-app-cfipopt ${{ github.ref_name }}" \
            --notes "CF IP 优选测速插件 (LuCI / iStoreOS / OpenWRT 24.10)

          - 参照 cmliu/edgetunnel 的优选逻辑: 随机生成 CF IP + 优选 API
          - OpenClash TUN 下自动以 gid 65534 (nobody) 绕过代理直连测速
          - LuCI 界面: 配置 / 进度 / 实时日志 / 结果复制下载
          - 输出格式: IP:端口#备注, 可直接用于 edgetunnel 节点列表

          安装: 系统 → 软件包 → 上传安装, 或 opkg install <ipk>" \
            luci-app-cfipopt_*.ipk
